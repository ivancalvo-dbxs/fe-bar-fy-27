bundle:
  name: acme-rct-analytics

include:
  - resources/*.yml

variables:
  catalog:
    description: Existing UC catalog that holds the bronze, silver and gold schemas (create it once, or override with BUNDLE_VAR_catalog)
    default: acme_rct_analytics
  llm_endpoint:
    description: Unity Gateway model service used by ai_query for the executive summary
    default: system.ai.claude-haiku-5-5

  app_name:
    description: Workspace-unique leadership app name
    default: acme-${workspace.current_user.domain_friendly_name}
  lakebase_project:
    description: Dedicated ACME Lakebase project name
    default: acme-rct-serving
  genie_warehouse_name:
    description: Display name of the existing warehouse used by Genie
    # Override with BUNDLE_VAR_genie_warehouse_name for another workspace.
    default: Serverless Starter Warehouse
  genie_warehouse:
    description: Existing warehouse used only by Genie
    lookup:
      warehouse: ${var.genie_warehouse_name}

targets:
  dev:
    default: true
    # no `mode: development`: it would prefix schema names, the data contract needs bronze, silver, gold
