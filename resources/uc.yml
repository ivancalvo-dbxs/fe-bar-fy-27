resources:
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: Raw synthetic files and 1:1 bronze tables
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: Cleaned and conformed entities
    gold:
      catalog_name: ${var.catalog}
